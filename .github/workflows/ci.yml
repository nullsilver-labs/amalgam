name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PASSWORD: amalgam-isolated-test-password
      AMALGAM_BIND_ADDRESS: '127.0.0.1'
      AMALGAM_PORT: '18790'
      # The suite runs through the stack's TLS proxy, so ORIGIN is the proxy's
      # address and the app is told to believe that one peer's forwarded headers.
      ORIGIN: https://localhost:18793
      AMALGAM_TRUSTED_PROXIES: 10.89.79.10
      POSTGRES_PASSWORD: amalgam-test-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: docker compose -p amalgam-check -f compose.yaml -f compose.test.yaml up -d --build --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - if: always()
        run: docker compose -p amalgam-check -f compose.yaml -f compose.test.yaml down -v
