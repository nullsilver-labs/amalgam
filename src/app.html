<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!--
			Apply the stored theme before the first paint, so a light-mode user never
			sees a dark flash (or the reverse). Mirrors prefs.svelte.ts — keep the
			storage key and the attribute in step with it.
		-->
		<script nonce="%sveltekit.nonce%">
			try {
				var p = JSON.parse(localStorage.getItem('amalgam:prefs') || '{}');
				if (p.theme === 'dark' || p.theme === 'light') document.documentElement.dataset.theme = p.theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
